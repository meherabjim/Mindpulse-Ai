name: MindPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mindpulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository_integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "backend/package.json"
            "backend/package-lock.json"
            "backend/eslint.config.cjs"
            "backend/test/backend-smoke.test.js"
            "ai_service/requirements.txt"
            "ai_service/pytest.ini"
            "mobile_app/pubspec.yaml"
            "mobile_app/pubspec.lock"
          )

          for required_file in "${required_files[@]}"; do
            if [[ ! -f "$required_file" ]]; then
              echo "Required file is missing: $required_file"
              exit 1
            fi
          done

          tracked_files="$(git ls-files)"

          forbidden_prefixes=(
            "ai_service/.venv/"
            "ai_service/reports/"
            "backend/node_modules/"
            "backend/coverage/"
            "mobile_app/.dart_tool/"
            "mobile_app/build/"
          )

          for prefix in "${forbidden_prefixes[@]}"; do
            if printf '%s\n' "$tracked_files" |
              grep -F "$prefix" |
              grep -q "^$prefix"; then
              echo "Forbidden generated path is tracked: $prefix"
              exit 1
            fi
          done

          legacy_backup_count="$(
            printf '%s\n' "$tracked_files" |
              grep -E '^backend/.*/app\.before-.*\.js$' |
              wc -l |
              tr -d ' ' ||
              true
          )"

          echo "Tracked legacy backend backup files: $legacy_backup_count"

          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "Checkout working tree is not clean."
            git status --short
            exit 1
          fi

          echo "Repository integrity gate passed."

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
          check-latest: false

      - name: Display runtime versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint zero-warning gate
        run: npm run lint

      - name: Run backend native tests
        run: npm test

  ai:
    name: AI service quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.5"
          cache: pip
          cache-dependency-path: |
            ai_service/requirements.txt
            ai_service/requirements-ml.txt

      - name: Display Python version
        run: python --version

      - name: Install AI service dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile active Python source
        run: python -m compileall -q app tests

      - name: Run plain pytest gate
        run: python -m pytest -q

  flutter:
    name: Flutter quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
          pub-cache: true

      - name: Display Flutter and Dart versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: dart analyze lib test

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter compact

  quality_gate:
    name: Integrated quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}

    needs:
      - repository_integrity
      - backend
      - ai
      - flutter

    env:
      REPOSITORY_RESULT: ${{ needs.repository_integrity.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      AI_RESULT: ${{ needs.ai.result }}
      FLUTTER_RESULT: ${{ needs.flutter.result }}

    steps:
      - name: Verify all required jobs
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository integrity: $REPOSITORY_RESULT"
          echo "Backend: $BACKEND_RESULT"
          echo "AI service: $AI_RESULT"
          echo "Flutter: $FLUTTER_RESULT"

          failed=0

          for result in \
            "$REPOSITORY_RESULT" \
            "$BACKEND_RESULT" \
            "$AI_RESULT" \
            "$FLUTTER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required quality gates failed."
            exit 1
          fi

          echo "MindPulse full-stack CI passed."
